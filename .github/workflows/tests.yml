name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test dependencies (the runtime uses only the standard library)
        run: python -m pip install --quiet numpy PyYAML
      - name: Engine, example and consistency tests
        run: python -m unittest discover -s tests -v
