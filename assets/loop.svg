<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d">
<title id="t">The loop of labyrinth exploration</title>
<desc id="d">Seven steps around a map: read the frontier, explore, predict boldly, test and log, referee, update the map, look for shortcuts. Refuted claims become dead ends with lessons; saturation is broken by an escalation ladder.</desc>
<style>
svg { --bg:#EEF1F5;--panel:#F7F8FA;--card:#FFFFFF;--ink:#17202B;--ink2:#465163;--ink3:#6F7A8C;--rule:#D3D9E2;--fog:#E2E6EC;--fog2:#CFD6DF;--neutral:#939DAC;--known:#1F5FA6;--wall:#B8462A;--evid:#00897B;--door:#A87400;--conj:#7A4FB5;--hunch:#D0508F; }
@media (prefers-color-scheme: dark) { svg { --bg:#0B0F14;--panel:#10151C;--card:#141B24;--ink:#E6EBF2;--ink2:#AEB8C7;--ink3:#808B9C;--rule:#263041;--fog:#1A212B;--fog2:#242D39;--neutral:#6E7989;--known:#4A8CDA;--wall:#D2603C;--evid:#11A392;--door:#B5821A;--conj:#9670E2;--hunch:#E45A9C; } }
.bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--rule); } .card { fill: var(--card); stroke: var(--rule); }
.ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .ink3 { fill: var(--ink3); }
.serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .mono { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.f-known { fill: var(--known); } .f-wall { fill: var(--wall); } .f-evid { fill: var(--evid); } .f-door { fill: var(--door); }
.f-conj { fill: var(--conj); } .f-hunch { fill: var(--hunch); } .f-neutral { fill: var(--neutral); }
.s-known { stroke: var(--known); } .s-wall { stroke: var(--wall); } .s-evid { stroke: var(--evid); } .s-door { stroke: var(--door); }
.s-conj { stroke: var(--conj); } .s-hunch { stroke: var(--hunch); } .s-ink { stroke: var(--ink); } .s-ink3 { stroke: var(--ink3); }
.s-rule { stroke: var(--rule); } .s-neutral { stroke: var(--neutral); }

</style>
<defs>
  <pattern id="hatch-wall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" style="fill: var(--panel)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke: var(--wall); stroke-width: 3.2"/>
  </pattern>
  <pattern id="fogdots" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" style="fill: var(--fog)"/><circle cx="2.5" cy="3" r="0.9" style="fill: var(--fog2)"/><circle cx="7" cy="7.5" r="0.9" style="fill: var(--fog2)"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" style="fill: var(--ink3)"/>
  </marker>
  <marker id="arrow-known" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" style="fill: var(--known)"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="1200" height="740" rx="28"/>
<text x="60.0" y="70.0" class="ink serif" font-size="34" font-weight="700" text-anchor="start" >The loop</text>
<text x="60.0" y="102.0" class="ink2 sans" font-size="17" font-weight="400" text-anchor="start" >One iteration changes the map. A refutation is progress: it turns a corridor into a wall.</text>
<ellipse cx="600" cy="412" rx="380" ry="222" fill="none" class="s-rule" stroke-width="2" stroke-dasharray="2 7"/>
