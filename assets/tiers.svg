<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">Tiers T1 to T6</title>
<desc id="d">Six tiers: T1 literature, T2 proved here, T3 exhaustive computation may be cited as facts; T4 is evidence; T5 conjectures and T6 hunches are speculation. T2 and T3 results also carry a review state.</desc>
<style>
svg { --bg:#EEF1F5;--panel:#F7F8FA;--card:#FFFFFF;--ink:#17202B;--ink2:#465163;--ink3:#6F7A8C;--rule:#D3D9E2;--fog:#E2E6EC;--fog2:#CFD6DF;--neutral:#939DAC;--known:#1F5FA6;--wall:#B8462A;--evid:#00897B;--door:#A87400;--conj:#7A4FB5;--hunch:#D0508F; }
@media (prefers-color-scheme: dark) { svg { --bg:#0B0F14;--panel:#10151C;--card:#141B24;--ink:#E6EBF2;--ink2:#AEB8C7;--ink3:#808B9C;--rule:#263041;--fog:#1A212B;--fog2:#242D39;--neutral:#6E7989;--known:#4A8CDA;--wall:#D2603C;--evid:#11A392;--door:#B5821A;--conj:#9670E2;--hunch:#E45A9C; } }
.bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--rule); } .card { fill: var(--card); stroke: var(--rule); }
.ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .ink3 { fill: var(--ink3); }
.serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .mono { font-family: SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.f-known { fill: var(--known); } .f-wall { fill: var(--wall); } .f-evid { fill: var(--evid); } .f-door { fill: var(--door); }
.f-conj { fill: var(--conj); } .f-hunch { fill: var(--hunch); } .f-neutral { fill: var(--neutral); }
.s-known { stroke: var(--known); } .s-wall { stroke: var(--wall); } .s-evid { stroke: var(--evid); } .s-door { stroke: var(--door); }
.s-conj { stroke: var(--conj); } .s-hunch { stroke: var(--hunch); } .s-ink { stroke: var(--ink); } .s-ink3 { stroke: var(--ink3); }
.s-rule { stroke: var(--rule); } .s-neutral { stroke: var(--neutral); }

</style>
<defs>
  <pattern id="hatch-wall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" style="fill: var(--panel)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke: var(--wall); stroke-width: 3.2"/>
  </pattern>
  <pattern id="fogdots" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" style="fill: var(--fog)"/><circle cx="2.5" cy="3" r="0.9" style="fill: var(--fog2)"/><circle cx="7" cy="7.5" r="0.9" style="fill: var(--fog2)"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" style="fill: var(--ink3)"/>
  </marker>
  <marker id="arrow-known" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" style="fill: var(--known)"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="1200" height="470" rx="28"/>
<text x="60.0" y="70.0" class="ink serif" font-size="34" font-weight="700" text-anchor="start" >Tiers keep proof apart from speculation</text>
<text x="60.0" y="102.0" class="ink2 sans" font-size="17" font-weight="400" text-anchor="start" >Every result, conjecture and hunch carries one. Nothing below T3 is ever cited as a fact.</text>
<rect x="60" y="168" width="166" height="132" rx="14" class="card s-known" stroke-width="1.5"/>
<rect x="60" y="168" width="166" height="10" rx="5" class="f-known"/>
<text x="78.0" y="220.0" class="mono f-known" font-size="30" font-weight="700" text-anchor="start" >T1</text>
<text x="78.0" y="254.0" class="ink sans" font-size="16" font-weight="700" text-anchor="start" >literature</text>
<text x="78.0" y="277.0" class="ink2 sans" font-size="13.5" font-weight="400" text-anchor="start" >proved, or standard</text>
<rect x="242" y="168" width="166" height="132" rx="14" class="card s-known" stroke-width="1.5"/>
<rect x="242" y="168" width="166" height="10" rx="5" class="f-known"/>
<text x="260.0" y="220.0" class="mono f-known" font-size="30" font-weight="700" text-anchor="start" >T2</text>
<text x="260.0" y="254.0" class="ink sans" font-size="16" font-weight="700" text-anchor="start" >proved here</text>
<text x="260.0" y="277.0" class="ink2 sans" font-size="13.5" font-weight="400" text-anchor="start" >not peer reviewed</text>
<rect x="424" y="168" width="166" height="132" rx="14" class="card s-known" stroke-width="1.5"/>
<rect x="424" y="168" width="166" height="10" rx="5" class="f-known"/>
<text x="442.0" y="220.0" class="mono f-known" font-size="30" font-weight="700" text-anchor="start" >T3</text>
<text x="442.0" y="254.0" class="ink sans" font-size="16" font-weight="700" text-anchor="start" >exhaustive</text>
<text x="442.0" y="277.0" class="ink2 sans" font-size="13.5" font-weight="400" text-anchor="start" >certified computation</text>
<rect x="630" y="168" width="166" height="132" rx="14" class="card s-evid" stroke-width="1.5"/>
<rect x="630" y="168" width="166" height="10" rx="5" class="f-evid"/>
<text x="648.0" y="220.0" class="mono f-evid" font-size="30" font-weight="700" text-anchor="start" >T4</text>
<text x="648.0" y="254.0" class="ink sans" font-size="16" font-weight="700" text-anchor="start" >evidence</text>
<text x="648.0" y="277.0" class="ink2 sans" font-size="13.5" font-weight="400" text-anchor="start" >sampled or partial</text>
<rect x="812" y="168" width="166" height="132" rx="14" class="card s-conj" stroke-width="1.5"/>
<rect x="812" y="168" width="166" height="10" rx="5" class="f-conj"/>
<text x="830.0" y="220.0" class="mono f-conj" font-size="30" font-weight="700" text-anchor="start" >T5</text>
<text x="830.0" y="254.0" class="ink sans" font-size="16" font-weight="700" text-anchor="start" >conjecture</text>
<text x="830.0" y="277.0" class="ink2 sans" font-size="13.5" font-weight="400" text-anchor="start" >with a stated test</text>
<rect x="994" y="168" width="166" height="132" rx="14" class="card s-hunch" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="1012.0" y="220.0" class="mono f-hunch" font-size="30" font-weight="700" text-anchor="start" >T6</text>
<text x="1012.0" y="254.0" class="ink sans" font-size="16" font-weight="700" text-anchor="start" >hunch</text>
<text x="1012.0" y="277.0" class="ink2 sans" font-size="13.5" font-weight="400" text-anchor="start" >a direction only</text>
<path d="M64,156 L64,146 L586,146 L586,156" fill="none" class="s-known" stroke-width="2"/><text x="325.0" y="136.0" class="sans f-known" font-size="14" font-weight="700" text-anchor="middle" >may be cited as fact (for the stated sizes)</text>
<path d="M634,156 L634,146 L792,146 L792,156" fill="none" class="s-evid" stroke-width="2"/><text x="713.0" y="136.0" class="sans f-evid" font-size="14" font-weight="700" text-anchor="middle" >evidence only</text>
<path d="M816,156 L816,146 L1156,146 L1156,156" fill="none" class="s-conj" stroke-width="2"/><text x="986.0" y="136.0" class="sans f-conj" font-size="14" font-weight="700" text-anchor="middle" >speculation, kept vivid</text>
<line x1="610" y1="160" x2="610" y2="308" class="s-ink3" stroke-width="2" stroke-dasharray="4 4"/>
<text x="60.0" y="342.0" class="ink2 sans" font-size="15" font-weight="400" text-anchor="start" >T2 and T3 results also carry a review state; a referee raises it, never the tier:</text>
<rect x="60" y="362" width="118" height="34" rx="17" class="card s-neutral" stroke-width="2"/>
<text x="119.0" y="384.0" class="mono f-neutral" font-size="14" font-weight="600" text-anchor="middle" >unreviewed</text>
<line x1="184" y1="379" x2="216" y2="379" class="s-ink3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="224.0" y="362" width="136" height="34" rx="17" class="card s-door" stroke-width="2"/>
<text x="292.2" y="384.0" class="mono f-door" font-size="14" font-weight="600" text-anchor="middle" >under-review</text>
<line x1="366" y1="379" x2="398" y2="379" class="s-ink3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="406.4" y="362" width="192" height="34" rx="17" class="card s-known" stroke-width="2"/>
<text x="502.2" y="384.0" class="mono f-known" font-size="14" font-weight="600" text-anchor="middle" >refereed (by whom)</text>
<line x1="604" y1="379" x2="636" y2="379" class="s-ink3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="644.0" y="362" width="146" height="34" rx="17" class="card s-evid" stroke-width="2"/>
<text x="716.8" y="384.0" class="mono f-evid" font-size="14" font-weight="600" text-anchor="middle" >human-checked</text>
<text x="839.6" y="384.0" class="ink3 sans" font-size="14" font-weight="400" text-anchor="start" >→ T1 only once published</text>
</svg>
